version: 2
updates:
  # The release dispatch that used to do this only ever named two of the four
  # yummacss packages, and its auto-merge step failed on every run. Dependabot
  # polls npm, so a missed run costs a day rather than a version.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    allow:
      - dependency-name: "yummacss"
      - dependency-name: "@yummacss/*"
    groups:
      yummacss:
        patterns:
          - "yummacss"
          - "@yummacss/*"

  # Without this, action versions never move - they drifted two to three majors
  # behind & only surfaced as a Node 20 deprecation warning. Grouped into a
  # single weekly PR so it stays quiet.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
