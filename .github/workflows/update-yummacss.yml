name: Update Yumma CSS

on:
  repository_dispatch:
    types: [yummacss-released]
  # Manually runnable so the workflow can be exercised without cutting a
  # release. Being unable to test a release path except by releasing is how
  # the dead `release` branch ref went unnoticed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Update yummacss packages
        run: pnpm up yummacss @yummacss/intellisense --latest

      - name: Open PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update yummacss to ${{ github.event.client_payload.version }}"
          branch: update/yummacss-${{ github.event.client_payload.version }}
          title: "chore: update yummacss to ${{ github.event.client_payload.version }}"
          body: |
            ### Changed

            - Update `yummacss` & `@yummacss/intellisense` to ${{ github.event.client_payload.version }}.

      - name: Auto-merge PR
        if: steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}